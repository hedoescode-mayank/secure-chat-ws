<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat-OS | Encrypted CLI</title>
    <link rel="stylesheet" href="public/css/terminal.css">
    <link rel="stylesheet" href="public/css/animations.css">
    <link rel="stylesheet" href="public/css/glassmorphism.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="crt-overlay"></div>
    <div class="scanline"></div>

    <main id="terminal"></main>

    <div class="prompt-container">
        <span class="prompt-label">user@secure-chat:~$</span>
        <input type="text" id="input" autofocus spellcheck="false" autocomplete="off">
        <span class="cursor"></span>
    </div>

    <!-- Scripts -->
    <script src="public/js/crypto.js"></script>
    <script src="public/js/socket.js"></script>
    <script src="public/js/terminal.js"></script>
    <script src="public/js/commands.js"></script>
    <script src="public/js/app.js"></script>
</body>
</html>
