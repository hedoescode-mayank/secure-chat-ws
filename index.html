<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat-OS | Encrypted CLI</title>
    <link rel="stylesheet" href="public/css/terminal.css">
    <link rel="stylesheet" href="public/css/animations.css">
    <link rel="stylesheet" href="public/css/glassmorphism.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="crt-overlay"></div>
    <div class="scanline"></div>

    <!-- Nickname Entry Box -->
    <div id="nickname-overlay">
        <div class="nickname-box glass">
            <div class="box-header">IDENTIFICATION REQUIRED</div>
            <div class="box-body">
                <p>PLEASE ENTER YOUR ACCESS_ID TO INITIALIZE SECURE CHANNEL:</p>
                <div class="input-wrapper">
                    <span class="prompt-symbol">>></span>
                    <input type="text" id="nickname-input" autofocus maxlength="15" spellcheck="false" autocomplete="off">
                </div>
                <div class="box-footer">PRESS [ENTER] TO AUTHENTICATE</div>
            </div>
        </div>
    </div>

    <!-- Terminal UI -->
    <main id="terminal" style="display: none;"></main>

    <div class="prompt-container" style="display: none;">
        <span class="prompt-label">user@secure-chat:~$</span>
        <input type="text" id="input" spellcheck="false" autocomplete="off">
        <span class="cursor"></span>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <!-- Scripts -->
    <script src="public/js/crypto.js"></script>
    <script src="public/js/firebase-service.js"></script>
    <script src="public/js/terminal.js"></script>
    <script src="public/js/commands.js"></script>
    <script src="public/js/app.js"></script>
</body>
</html>
